<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reed Chore Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Lilita+One&display=swap">
<style>
html,body{margin:0;padding:0}
[hidden]{display:none!important}

/* Layout: a 1920×1080 TV stage scaled to fit — four kid columns (daily chores, then the Super Chore), then a rail with Special Cleaning above the Chore Store and Team Jar. Stacks to one column on phones for editing. */
:root{
  color-scheme:dark;
  --night:#141833;--panel:#1e2448;--panel-2:#283063;--line:#343c74;
  --ink:#1a1d36;--text:#f1f2ff;--muted:#a3aad8;--gold:#ffc83d;--ok:#46d07c;
  --julian:#ff6fae;--julian-t:#ffe1ee;
  --eli:#53d36f;--eli-t:#dbf6e1;
  --teddy:#4ba9ff;--teddy-t:#dcecff;
  --theo:#ff8a4c;--theo-t:#ffe6d7;
  --jar:#ffc83d;--jar-t:#fff1c7;
  --neutral-t:#ecebf8;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --read:"Andika","Verdana","Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--night);color:var(--text)}
body{font-family:var(--read);
  background-image:radial-gradient(1.6px 1.6px at 8% 14%,#ffffff40 50%,transparent 52%),radial-gradient(1.4px 1.4px at 31% 6%,#ffffff30 50%,transparent 52%),radial-gradient(1.8px 1.8px at 57% 11%,#ffffff38 50%,transparent 52%),radial-gradient(1.4px 1.4px at 83% 4%,#ffffff30 50%,transparent 52%),radial-gradient(1.6px 1.6px at 94% 20%,#ffffff38 50%,transparent 52%)}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

#stage{display:flex;flex-direction:column;gap:20px;max-width:1500px;margin:0 auto;padding-inline:16px;padding-block:16px}
html.tv,html.tv body{height:100%;overflow:hidden}
html.tv #stage{position:fixed;left:0;top:0;width:1920px;height:1080px;max-width:none;margin:0;padding:24px 30px 28px;transform-origin:0 0}

/* header */
.top{display:flex;align-items:flex-end;gap:16px 24px;flex-wrap:wrap}
.brand{display:block;font:400 18px/1 var(--display);letter-spacing:.09em;text-transform:uppercase;color:var(--gold)}
h1{font:400 34px/1.05 var(--display);margin:6px 0 0;text-wrap:balance}
html.tv h1{font-size:40px}
html.tv .top{align-items:center}
.jarpill{display:flex;align-items:center;gap:12px;background:var(--panel);border:3px solid var(--gold);border-radius:999px;padding:6px 8px 6px 10px;color:var(--text)}
html.tv .jarpill{margin-left:auto}
button.jarpill{cursor:pointer}
.jarpill>.ic{width:40px;height:40px}
.jl{font:400 24px/1 var(--display)}
.jn{display:flex;align-items:center;gap:6px;background:var(--night);color:var(--gold);border-radius:999px;padding:4px 14px 4px 5px;font:400 28px/1 var(--display);font-variant-numeric:tabular-nums}
.jn svg{width:30px;height:30px}
.shares{display:flex;flex-wrap:wrap;gap:4px 12px;max-width:480px;padding:0 8px 0 4px;font:400 17px/1.15 var(--display)}
.share{display:flex;align-items:center;gap:5px;white-space:nowrap}
.share i{width:12px;height:12px;border-radius:50%;background:var(--k)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.status{font-size:15px;color:var(--muted)}

/* main grid */
.main{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;align-items:start}
html.tv .main{grid-template-columns:repeat(4,minmax(0,1fr)) 550px;flex:1;min-height:0;align-items:stretch}
.rail{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;min-width:0;align-items:start}
html.tv .rail{grid-column:auto;display:flex;flex-direction:column;gap:16px;align-items:stretch}

/* kid cards */
.kid{background:var(--panel);border-radius:26px;overflow:hidden;display:flex;flex-direction:column;border:3px solid var(--k);min-width:0}
.band{background:var(--k);color:var(--night);display:flex;align-items:center;gap:10px;padding:9px 10px 9px 18px}
.who2{flex:1;min-width:0}
.band h2{font:400 38px/1 var(--display);margin:0;overflow-wrap:anywhere}
.band .ptoday{display:block;font:400 17px/1 var(--display);color:var(--night);opacity:.75;margin-top:3px}
.bank{display:flex;align-items:center;gap:6px;background:var(--night);color:var(--gold);border-radius:999px;padding:4px 14px 4px 5px;font:400 34px/1 var(--display);font-variant-numeric:tabular-nums}
.bank svg{width:36px;height:36px}
.mini{background:var(--night);color:var(--text);border:0;border-radius:12px;width:40px;height:40px;font:400 24px/1 var(--display);cursor:pointer}
.prog{display:flex;align-items:center;gap:10px;padding:12px 18px 2px}
.pips{display:flex;gap:5px;flex-wrap:wrap;align-items:center;flex:1}
.pip{width:16px;height:16px;border-radius:50%;border:3px solid var(--k)}
.pip.on{background:var(--k)}
.pips svg{width:26px;height:26px;opacity:.28}
.pips svg.on{opacity:1}
.ptoday{font:400 21px/1 var(--display);color:var(--gold);white-space:nowrap}
.rooms{display:flex;flex-direction:column;gap:4px;padding:10px 12px 10px}
.room h3{font:700 13px/1 var(--read);letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:7px 8px 4px}
.list{display:flex;flex-direction:column;gap:2px}
.chore,.sp{display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:10px;padding:1px 6px 1px 2px;border-radius:16px;background:transparent;border:0;text-align:left;width:100%}
button.chore,button.sp,button.item{cursor:pointer}
button.chore:hover,button.sp:hover{background:var(--panel-2)}
.tile{position:relative;width:42px;height:42px;border-radius:12px;background:var(--kt);display:grid;place-items:center}
.tile .ic{width:34px;height:34px}
.lbl{font-size:18px;line-height:1.1;font-weight:700}
.pts{font:400 21px/1 var(--display);color:var(--gold);display:flex;align-items:center;gap:4px;white-space:nowrap}
.pts svg{width:22px;height:22px}
.done .lbl{color:var(--muted);text-decoration:line-through;text-decoration-thickness:3px;text-decoration-color:var(--k)}
.done .tile .ic{opacity:.3}
.done .pts{opacity:.45}
.check{position:absolute;right:-7px;bottom:-7px;width:28px;height:28px}
.super{margin:auto 12px 12px;border:3px dashed var(--gold);border-radius:18px;padding:6px 6px 6px}
.super .list{gap:1px}
.super h3{display:flex;align-items:center;gap:6px;font:400 18px/1 var(--display);color:var(--gold);margin:3px 6px 4px;letter-spacing:.02em}
.super h3 .ic{width:22px;height:22px}
.super .tile{background:var(--jar-t)}

/* rail panels */
.panel{background:var(--panel);border-radius:26px;padding:14px 16px 16px;border:3px solid var(--line);min-width:0}
.ph{display:flex;align-items:baseline;gap:12px;margin-bottom:8px;flex-wrap:wrap}
.ph h2{font:400 30px/1 var(--display);margin:0}
.wk{font:400 19px/1 var(--display);color:var(--gold);margin-left:auto}
.special .list{gap:2px}
.sp{grid-template-columns:46px minmax(0,1fr) auto}
.sp .tile{width:46px;height:46px;border-radius:14px;background:var(--neutral-t)}
.sp .tile .ic{width:38px;height:38px}
.sp .lbl{font-size:19px}
.sp-end{display:flex;align-items:center;gap:8px}
.who{font:400 17px/1 var(--display);background:var(--k);color:var(--night);border-radius:999px;padding:6px 12px;white-space:nowrap}
.empty{color:var(--muted);font-size:18px;padding:8px 4px}
.addrow{margin-top:8px}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media (max-width:520px){html:not(.tv) .shop{grid-template-columns:1fr}}
.item{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:9px;align-items:center;background:var(--panel-2);border-radius:14px;padding:4px 10px 4px 4px;border:0;text-align:left;width:100%}
.disc{width:44px;height:44px;border-radius:12px;background:var(--neutral-t);display:grid;place-items:center}
.disc .ic{width:36px;height:36px}
.nm{display:block;font-size:16px;line-height:1.12;font-weight:700}
.meta{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.price{font:400 22px/1 var(--display);color:var(--gold);display:flex;gap:4px;align-items:center;white-space:nowrap}
.price svg{width:22px;height:22px}
.price small{font:700 14px/1 var(--read);color:var(--gold)}
.can{display:flex;gap:4px}
.can i{width:11px;height:11px;border-radius:50%;background:var(--k);opacity:.16}
.can i.on{opacity:1}
.sub{display:flex;align-items:center;gap:8px;font:400 22px/1 var(--display);margin:12px 2px 7px;color:var(--gold)}
.sub .ic{width:30px;height:30px}
.bar{width:64px;height:9px;border-radius:999px;background:var(--night);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:999px}
.item.ready{box-shadow:inset 0 0 0 3px var(--gold)}
.shop .item:last-child:nth-child(odd){grid-column:1/-1}
.btn.k.sel{box-shadow:0 0 0 3px var(--text)}
.diag{margin:0;padding:8px 16px 24px;color:var(--muted);font-size:14px;text-align:center}
.note{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--panel);border:3px solid var(--gold);border-radius:16px;padding:12px 16px;font-size:16px;max-width:calc(100% - 32px);color:var(--text)}

/* buttons + sheet */
.btn{font:400 19px/1.1 var(--display);background:var(--panel-2);color:var(--text);border:2px solid var(--line);border-radius:14px;padding:10px 16px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.k{background:var(--k);color:var(--night);border-color:var(--k);display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px 14px}
.btn.k small{font:700 14px var(--read)}
.btn.gold{background:var(--gold);color:var(--night);border-color:var(--gold)}
.btn.warn{border-color:#ff6b6b;color:#ffb3b3}
.btn:disabled{opacity:.3;cursor:not-allowed}
#sheet{position:fixed;inset:0;z-index:50;display:grid;place-items:end center}
@media (min-width:700px){#sheet{place-items:center}}
.scrim{position:absolute;inset:0;background:rgba(8,10,25,.72)}
.sheet-card{position:relative;background:var(--panel);border:3px solid var(--line);border-radius:24px;width:min(560px,calc(100% - 24px));max-height:86vh;overflow:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));margin:12px}
.sh-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.sh-head h2{font:400 28px/1.1 var(--display);margin:0;flex:1}
.x{background:none;border:0;font:400 32px/1 var(--display);color:var(--muted);cursor:pointer;width:40px;height:40px}
.sheet-body{display:flex;flex-direction:column;gap:14px}
.lead{margin:0;font-size:18px;color:var(--muted)}
.kidpick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stepper{display:flex;align-items:center;gap:12px}
.sv{font:400 24px var(--display);color:var(--gold);min-width:6ch;text-align:center;font-variant-numeric:tabular-nums}
.field label{display:block;font-size:15px;color:var(--muted);margin-bottom:6px}
.field input{font:18px var(--read);background:var(--night);color:var(--text);border:2px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px}
.pick{background:var(--neutral-t);border:3px solid transparent;border-radius:14px;aspect-ratio:1;display:grid;place-items:center;cursor:pointer;max-width:100%}
.pick .ic{width:38px;height:38px}
.pick.sel{border-color:var(--gold)}
.hist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.hist li{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:10px;align-items:center;font-size:16px;padding:6px 0;border-bottom:1px solid var(--line)}
.hist .dot{width:12px;height:12px;border-radius:50%;background:var(--k)}
.hist .when{color:var(--muted);font-size:13px;display:block}
.hist .amt{font:400 19px var(--display);font-variant-numeric:tabular-nums}
.hist .neg{color:#ff9b9b}.hist .pos{color:var(--gold)}
.hist button{padding:6px 10px;font-size:15px}

svg.ic{fill:none;stroke:var(--ink);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
@media (prefers-reduced-motion:no-preference){button.chore .tile{transition:transform .15s}button.chore:active .tile{transform:scale(.93)}}

</style>
</head>

function ic(n,cls){return '<svg class="ic'+(cls?' '+cls:'')+'" viewBox="0 0 64 64" aria-hidden="true">'+(I[n]||I.star)+'</svg>';}
function coin(){return '<svg class="ic" viewBox="0 0 64 64" aria-hidden="true">'+COIN+'</svg>';}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function today(){return ymd(new Date());}
function week(){var d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function kv(id){return '--k:var(--'+id+');--kt:var(--'+id+'-t)';}
function kid(id){for(var i=0;i<S.kids.length;i++)if(S.kids[i].id===id)return S.kids[i];return null;}
function who(id){if(id==='jar')return 'Team Jar';var k=kid(id);return k?k.name:'';}
function balance(id){var b=S.base[id]||0;S.ledger.forEach(function(e){if(e.kid===id)b+=e.pts;});return b;}
function earnedToday(id){var t=today(),n=0;S.ledger.forEach(function(e){if(e.kid===id&&e.day===t&&e.pts>0&&e.ref&&e.ref.indexOf('c:')===0)n+=e.pts;});return n;}
function entry(r){for(var i=0;i<S.ledger.length;i++)if(S.ledger[i].ref===r)return S.ledger[i];return null;}
function hasRef(r){return !!entry(r);}
function removeRef(r){S.ledger=S.ledger.filter(function(e){return e.ref!==r;});D.add=D.add.filter(function(e){return e.ref!==r;});D.delRefs.push(r);}
function removeId(id){S.ledger=S.ledger.filter(function(e){return e.id!==id;});D.add=D.add.filter(function(e){return e.id!==id;});D.del.push(id);}
function add(k,pts,what,ref){var e={id:uid(),t:Date.now(),day:today(),kid:k,pts:pts,what:what,ref:ref||null};S.ledger.push(e);D.add.push(e);}
function choreDone(c){return hasRef('c:'+today()+':'+c.id);}
function superRef(k,i){return 'u:'+week()+':'+k.id+':'+i;}
function jarShare(id){var n=(S.jarBase&&S.jarBase[id])||0;S.ledger.forEach(function(e){if(e.kid===id&&e.ref&&e.ref.indexOf('jt:')===0)n-=e.pts;});return n;}
function specialRef(it){return 's:'+week()+':'+it.id;}
function assigned(it){return it.assign&&it.assign.w===week()?it.assign.kid:null;}
function shareHtml(){
  var tot=0,v=S.kids.map(function(k){var n=Math.max(0,jarShare(k.id));tot+=n;return n;});
  return '<span class="shares">'+S.kids.map(function(k,i){var pc=tot?Math.round(v[i]/tot*100):0;return '<span class="share" style="'+kv(k.id)+'"><i></i>'+esc(k.name)+' '+pc+'%</span>';}).join('')+'</span>';
}

    var e=entry(specialRef(it)),wid=e?e.kid:assigned(it),w=wid?kid(wid):null,tag=tagOf();
    h+='<'+tag+' class="sp'+(e?' done':'')+'"'+(w?' style="'+kv(w.id)+'"':'')+(canEdit?' data-act="special" data-id="'+it.id+'"':'')+'><span class="tile">'+ic(it.icon)+(e?CHECK:'')+'</span><span class="lbl">'+esc(it.title)+'</span><span class="sp-end">'+(w?'<span class="who">'+esc(w.name)+'</span>':'')+'<span class="pts">+'+it.pts+coin()+'</span></span></'+tag+'>';
  });

  S.store.forEach(function(it){
    var need=it.min||it.cost,tag=tagOf();

function fit(){
  var w=window.innerWidth,hh=window.innerHeight,tv=w>=1000&&w/hh>=1.25,st=document.getElementById('stage');
  var was=document.documentElement.classList.contains('tv');document.documentElement.classList.toggle('tv',tv);canEdit=!tv;if(was!==tv&&typeof render==='function'&&window.__ready)render();
  if(tv){var s=Math.min(w/1920,hh/1080);st.style.transform='translate('+((w-1920*s)/2)+'px,'+((hh-1080*s)/2)+'px) scale('+s+')';}
  else st.style.transform='';
}

/* ---- saving ---- */
function showNote(t){var n=document.getElementById('note');if(!n){n=document.createElement('div');n.id='note';n.className='note';document.body.appendChild(n);}n.textContent=t;n.hidden=false;clearTimeout(showNote.t);showNote.t=setTimeout(function(){n.hidden=true;},8000);}
function setStatus(s){statusText=s;var el=document.getElementById('status');if(el)el.textContent=s;}
function changed(){render();setStatus('Saving…');clearTimeout(saveTimer);saveTimer=setTimeout(save,800);}
function markSpecial(){D.specialSnap=JSON.parse(JSON.stringify(S.special));D.storeSnap=JSON.parse(JSON.stringify(S.store));D.teamSnap=JSON.parse(JSON.stringify(S.team));if(saving)D.dirtyAgain=true;}
function pending(){return D.add.length||D.del.length||D.delRefs.length||D.special;}
function reapply(){ // put this phone's unsaved changes back on top of fresh server data
  var dr={};D.delRefs.forEach(function(r){dr[r]=1;});var di={};D.del.forEach(function(x){di[x]=1;});
  S.ledger=S.ledger.filter(function(e){return !di[e.id]&&!(e.ref&&dr[e.ref]);});
  var have={};S.ledger.forEach(function(e){have[e.id]=1;});
  D.add.forEach(function(e){if(!have[e.id])S.ledger.push(e);});
  if(D.special&&D.specialSnap){S.special=D.specialSnap;S.store=D.storeSnap;S.team=D.teamSnap;}
}
function takeServer(d){
  if(!d){serverEmpty=true;return;}
  serverEmpty=false;version=d.version||0;
  S.base=d.base||{};S.jarBase=d.jarBase||{};S.ledger=d.ledger||[];S.special=d.special||[];if(d.store)S.store=d.store;if(d.team)S.team=d.team;
}
function post(body){
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}).then(function(r){return r.json();});
}
function save(){
  if(!API)return;
  if(saving){clearTimeout(saveTimer);saveTimer=setTimeout(save,700);return;}
  if(!pending()&&!serverEmpty){setStatus('Saved');return;}
  var body={add:D.add,del:D.del,delRefs:D.delRefs,special:D.special?S.special:null,store:D.special?S.store:null,team:D.special?S.team:null};
  if(serverEmpty)body.seed={base:SEED.base,jarBase:SEED.jarBase,ledger:SEED.ledger,special:SEED.special,store:S.store,team:S.team};
  var sent={add:D.add.length,del:D.del.length,delRefs:D.delRefs.length,special:D.special};
  saving=true;setStatus('Saving…');
  post(body).then(function(res){
    saving=false;
    if(!res||!res.ok){
      setStatus('Not saved. Retrying…');saveTimer=setTimeout(save,4000);return;
    }
    D.add=D.add.slice(sent.add);D.del=D.del.slice(sent.del);D.delRefs=D.delRefs.slice(sent.delRefs);
    if(sent.special&&D.special===sent.special&&!D.dirtyAgain)D.special=false;D.dirtyAgain=false;
    takeServer(res.data);reapply();render();
    if(pending())save();else setStatus('Saved');
  },function(){saving=false;setStatus('Offline. Retrying…');saveTimer=setTimeout(save,5000);});
}
function refresh(){
  if(!API||saving||sheetH)return;
  fetch(API).then(function(r){return r.json();}).then(function(res){
    if(!res||!res.ok||saving||sheetH)return;
    loaded=true;takeServer(res.data);reapply();render();
  },function(){});
}

function toggleChore(kId,cId){
  var k=kid(kId),c=k.chores.filter(function(x){return x.id===cId;})[0],ref='c:'+today()+':'+cId;

function openBuy(id){
  var it=S.store.filter(function(s){return s.id===id;})[0],amt=5,armed=false;if(!it)return;

  openSheet(it.title,draw(),{
    rm:function(){if(!armed){armed=true;setBody(draw());return;}S.store=S.store.filter(function(x){return x.id!==id;});D.special=true;markSpecial();closeSheet();changed();},
    inc:function(){amt=Math.min(100,amt+1);setBody(draw());},
    dec:function(){amt=Math.max(1,amt-1);setBody(draw());},
    pick:function(b){add(b.dataset.kid,-cost(),'Bought: '+it.title+(it.unit?' ($'+amt+')':''),'buy:'+uid());closeSheet();changed();}

function openSpecial(id){
  var armed=false,it0=S.special.filter(function(s){return s.id===id;})[0];if(!it0)return;
  function cur(){return S.special.filter(function(s){return s.id===id;})[0]||it0;}
  function draw(){
    var it=cur(),e=entry(specialRef(it)),a=assigned(it);
    var top=e?'<p class="lead">Done by '+esc(who(e.kid))+' for '+it.pts+' coins.</p><div class="row"><button class="btn" data-s="undo">Mark not done</button></div>':
      '<p class="lead">Worth '+it.pts+' coins. Who is doing it this week?</p>'+kidButtons(null,'assign',a)+
      '<div class="row"><button class="btn gold" data-s="done"'+(a?'':' disabled')+'>'+(a?'Mark done by '+esc(who(a)):'Pick a kid first')+'</button>'+(a?'<button class="btn" data-s="clear">Unassign</button>':'')+'</div>';
    return top+'<div class="row"><button class="btn warn" data-s="del">'+(armed?'Tap again to remove':'Remove this job')+'</button></div>';
  }
  openSheet(it0.title,draw(),{
    assign:function(b){cur().assign={w:week(),kid:b.dataset.kid};D.special=true;markSpecial();setBody(draw());changed();},
    clear:function(){cur().assign=null;D.special=true;markSpecial();setBody(draw());changed();},
    done:function(){var it=cur(),a=assigned(it);if(!a)return;add(a,it.pts,'Special: '+it.title,specialRef(it));closeSheet();changed();},
    undo:function(){removeRef(specialRef(cur()));closeSheet();changed();},
    del:function(){if(!armed){armed=true;setBody(draw());return;}S.special=S.special.filter(function(s){return s.id!==id;});D.special=true;markSpecial();closeSheet();changed();}
  });
}
function openAddSpecial(){
  var icon='star',pts=5;
  function draw(){var title=document.getElementById('sp-title');var v=title?title.value:'';var pe=document.getElementById('sp-pts');if(pe&&+pe.value>0)pts=Math.round(+pe.value);
    return '<div class="field"><label for="sp-title">Job</label><input id="sp-title" value="'+esc(v)+'" placeholder="Wipe the baseboards"></div><div><p class="lead" style="margin-bottom:8px">Picture</p><div class="picks">'+SPECIAL_ICONS.map(function(n){return '<button class="pick'+(n===icon?' sel':'')+'" data-s="icon" data-n="'+n+'" aria-label="'+n+'">'+ic(n)+'</button>';}).join('')+'</div></div><div class="field"><label for="sp-pts">Coins</label><input id="sp-pts" type="number" inputmode="numeric" min="1" max="999" value="'+pts+'"></div><div class="row"><button class="btn gold" data-s="save">Add job</button></div>';}
  openSheet('New special cleaning',draw(),{
    icon:function(b){icon=b.dataset.n;setBody(draw());},
    save:function(){var v=(document.getElementById('sp-title').value||'').trim();if(!v){document.getElementById('sp-title').focus();return;}
      var pv=Math.round(+document.getElementById('sp-pts').value);if(!(pv>0)){document.getElementById('sp-pts').focus();return;}pts=pv;
      S.special.push({id:'s'+uid(),title:v,icon:icon,pts:pts,assign:null});D.special=true;markSpecial();closeSheet();changed();}
  });
}
var REWARD_ICONS=['star','gamepad','candy','popcorn','tv','moon','dinner','pizza','bag','cart','ticket','icecream','burger','dice','bowling','trampoline','ferris','tent','duo','map','d20','car'];
function openAddReward(){
  var icon='star',cost=50,team=false;
  function draw(){var t=document.getElementById('rw-title'),v=t?t.value:'',ce=document.getElementById('rw-cost');if(ce&&+ce.value>0)cost=Math.round(+ce.value);
    return '<div class="field"><label for="rw-title">Reward</label><input id="rw-title" value="'+esc(v)+'" placeholder="30 min of game time"></div>'+
      '<div class="field"><label for="rw-cost">Coins</label><input id="rw-cost" type="number" inputmode="numeric" min="1" max="99999" value="'+cost+'"></div>'+
      '<div class="row"><button class="btn'+(!team?' gold':'')+'" data-s="solo">Each kid buys</button><button class="btn'+(team?' gold':'')+'" data-s="team">Team Jar</button></div>'+
      '<div><p class="lead" style="margin-bottom:8px">Picture</p><div class="picks">'+REWARD_ICONS.map(function(n){return '<button class="pick'+(n===icon?' sel':'')+'" data-s="icon" data-n="'+n+'" aria-label="'+n+'">'+ic(n)+'</button>';}).join('')+'</div></div>'+
      '<div class="row"><button class="btn gold" data-s="save">Add to store</button></div>';}
  openSheet('New store item',draw(),{
    icon:function(b){icon=b.dataset.n;setBody(draw());},
    solo:function(){team=false;setBody(draw());},
    team:function(){team=true;setBody(draw());},
    save:function(){var v=(document.getElementById('rw-title').value||'').trim();if(!v){document.getElementById('rw-title').focus();return;}
      var c=Math.round(+document.getElementById('rw-cost').value);if(!(c>0)){document.getElementById('rw-cost').focus();return;}
      var item={id:(team?'g':'r')+uid(),title:v,icon:icon,cost:c};
      if(team){S.team.push(item);S.team.sort(function(a,b){return a.cost-b.cost;});}else S.store.push(item);
      D.special=true;markSpecial();closeSheet();changed();}
  });
}
function openHistory(){
  function draw(){
    var rows=S.ledger.slice().sort(function(a,b){return b.t-a.t;}).slice(0,60);
    if(!rows.length)return '<p class="lead">Nothing yet. Chores, purchases, Team Jar coins and adjustments show up here.</p>';
    return '<ul class="hist">'+rows.map(function(e){var d=new Date(e.t);
      return '<li style="'+kv(e.kid)+'"><span class="dot"></span><span>'+esc(who(e.kid))+' · '+esc(e.what)+'<span class="when">'+esc(d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})+' '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}))+'</span></span><span class="amt '+(e.pts<0?'neg':'pos')+'">'+(e.pts>0?'+':'')+e.pts+'</span><button class="btn" data-s="undo" data-id="'+e.id+'">Undo</button></li>';}).join('')+'</ul>';
  }
  openSheet('History',draw(),{
    undo:function(b){var e=S.ledger.filter(function(x){return x.id===b.dataset.id;})[0];if(!e)return;
      if(e.ref&&e.ref.indexOf('jt:')===0){var base=e.ref.slice(0,e.ref.lastIndexOf(':')+1);removeRef(base+'k');removeRef(base+'j');}
      else removeId(e.id);
      setBody(draw());changed();}
  });
}

document.addEventListener('click',function(ev){
  var s=ev.target.closest('[data-s]');
  if(s&&sheetH){var n=s.dataset.s;if(n==='close')closeSheet();else if(sheetH[n])sheetH[n](s);return;}
  var b=ev.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act;
  if(!canEdit)return;
  if(a==='chore')toggleChore(b.dataset.kid,b.dataset.id);
  else if(a==='super')toggleSuper(b.dataset.kid,+b.dataset.i);
  else if(a==='buy')openBuy(b.dataset.id);
  else if(a==='team')openTeam(b.dataset.id);
  else if(a==='jar')openJar();
  else if(a==='adjust')openAdjust(b.dataset.kid);
  else if(a==='special')openSpecial(b.dataset.id);
  else if(a==='addspecial')openAddSpecial();
  else if(a==='addreward')openAddReward();
  else if(a==='history')openHistory();
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&sheetH)closeSheet();});


fit();render();window.__ready=true;
window.addEventListener('resize',fit);
setInterval(function(){var t=today();if(t!==lastDay){lastDay=t;render();}},60000);
try{if(navigator.wakeLock&&document.documentElement.classList.contains('tv'))navigator.wakeLock.request('screen').catch(function(){});}catch(e){}
if(!API){var w=document.createElement('p');w.className='diag';w.textContent='Board not connected yet.';document.getElementById('app').appendChild(w);}
refresh();
setInterval(refresh,20000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)refresh();});
})();
</script>
</body>
</html>
